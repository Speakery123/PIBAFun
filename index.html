            <h2>Random quest</h2>
            <p id="random-display">Click and check!</p>
            <!-- TODO: dodaj przycisk uruchamiający losowanie -->
             <button onclick="randomItem()">Check</button>
        </div>
        <div class="card">
            <h2>Widget</h2>
            <!-- TODO: osadź zewnętrzny widget za pomocą iframe -->
             <h3>Nothing here...</h3>
        </div>
